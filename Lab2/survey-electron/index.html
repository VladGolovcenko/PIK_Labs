<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма опитування</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #222;
        }

        .container {
            background: #fff;
            width: 500px;
            padding: 40px;
            border: 1px solid #ddd;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 16px;
        }

        .progress {
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
        }

        .question {
            font-size: 15px;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        textarea {
            width: 100%;
            height: 100px;
            border: 1px solid #ccc;
            padding: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #555;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button {
            padding: 8px 24px;
            font-size: 13px;
            font-family: 'Segoe UI', sans-serif;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #f0f0f0;
        }

        button:disabled {
            opacity: 0.3;
            cursor: default;
        }

        #btnNext {
            background: #222;
            color: #fff;
            border-color: #222;
        }

        #btnNext:hover {
            background: #444;
        }

        .done {
            text-align: center;
            padding: 20px 0;
        }

        .done p {
            font-size: 15px;
            margin-bottom: 20px;
            color: #444;
        }

        .done button {
            background: #222;
            color: #fff;
            border-color: #222;
            padding: 10px 32px;
        }

        .done button:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Форма опитування</h1>

        <div id="surveyView">
            <div class="progress" id="progress"></div>
            <div class="question" id="question"></div>
            <textarea id="answer" placeholder="Введіть вашу відповідь..."></textarea>
            <div class="buttons">
                <button id="btnPrev">Назад</button>
                <button id="btnNext">Далі</button>
            </div>
        </div>

        <div id="doneView" class="done" style="display:none;">
            <p>Всі відповіді зібрано. Оберіть файл для збереження.</p>
            <button id="btnSave">Зберегти результати</button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
